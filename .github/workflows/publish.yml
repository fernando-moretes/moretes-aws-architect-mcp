name: Publish

# Tag v* (ou disparo manual): publica no MCP Registry via OIDC, sem segredo.
# O npm também vai por OIDC (Trusted Publisher configurado no npmjs.com para
# este repositório e este arquivo), sem token e com provenance automática.
# O server.json ganha a entrada "packages" e o Registry valida o mcpName.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run docs:check
      - run: npm run package:smoke
      - name: Check versions match
        run: |
          PKG=$(node -p "require('./package.json').version")
          SRV=$(node -p "require('./server.json').version")
          [ "$PKG" = "$SRV" ] || { echo "package.json $PKG != server.json $SRV"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then [ "v$PKG" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$PKG"; exit 1; }; fi
      - name: Publish to npm (Trusted Publisher, OIDC)
        run: |
          # Trusted publishing exige npm 11.5.1 ou mais novo; o Node 22 traz o 10.
          npm install -g npm@^11.5.1
          V=$(node -p "require('./package.json').version")
          if npm view "moretes-aws-architect-mcp@$V" version >/dev/null 2>&1; then
            echo "moretes-aws-architect-mcp@$V já está no npm; segue para o Registry."
          else
            npm publish --access public
          fi
          jq --arg v "$V" \
            '.packages = [{"registryType":"npm","identifier":"moretes-aws-architect-mcp","version":$v,"transport":{"type":"stdio"}}]' \
            server.json > server.tmp && mv server.tmp server.json
      - name: SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.ref_name }}
          path: sbom.cdx.json
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Wait for npm to serve the version
        run: |
          # O npm processa o pacote de forma assíncrona; na v0.4.0 levou ~2 min e
          # o Registry recusou com 404 por validar antes da versão aparecer.
          V=$(node -p "require('./package.json').version")
          for i in $(seq 1 60); do
            npm view "moretes-aws-architect-mcp@$V" version >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "moretes-aws-architect-mcp@$V não apareceu no npm em 10 min"; exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
