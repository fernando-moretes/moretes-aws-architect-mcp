name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Contracts are up to date (output schemas, tools lock)
        run: |
          node scripts/contracts.mjs
          git diff --exit-code -- src/data/output-schemas.json docs/tools.lock.json
      - run: npm run docs:check
      - name: Clean consumer package install (CLI and stdio)
        run: npm run package:smoke
      - name: Coverage summary
        if: matrix.node == 22
        run: |
          npm run coverage 2>&1 | sed -n '/start of coverage report/,/end of coverage report/p' > coverage.txt
          { echo '### Test coverage'; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - run: npm audit --omit=dev --audit-level=high
